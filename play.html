<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assassin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Luckiest+Guy&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/play.css" />
  </head>
  <body class="noir">
    <div class="noir-scene" aria-hidden="true">
      <div class="noir-vignette"></div>
      <div class="noir-grain"></div>
    </div>

    <div class="noir-stage">
      <h1 class="assassin-mark">Assassin</h1>
      <p class="begin-msg" id="begin-msg" hidden>Game About To Begin</p>

      <div id="player-error" class="errors noir-error" hidden></div>

      <section class="noir-card" id="join-panel" hidden>
        <p class="noir-kicker">Choose your cover</p>
        <form id="join-form">
          <label class="field">
            Your name
            <input id="player-name" type="text" maxlength="24" autocomplete="nickname" placeholder="Taylor" required />
          </label>
          <p class="field-label">Your team</p>
          <div class="pick-grid" id="team-picks" role="group" aria-label="Choose a team"></div>
          <div id="join-errors" class="errors" hidden></div>
          <button class="btn primary wide" type="submit" id="join-btn">Join the game</button>
        </form>
      </section>

      <section class="noir-card question-card-play" id="question-panel" hidden>
        <p class="noir-kicker" id="question-progress">Question</p>
        <h2 class="question-prompt" id="question-prompt"></h2>
        <div class="answer-grid" id="answer-choices"></div>
        <p class="answer-feedback" id="answer-feedback" hidden></p>
        <p class="score-line" id="score-line">Score: 0</p>
      </section>

      <section class="noir-card" id="done-panel" hidden>
        <p class="noir-kicker">Round complete</p>
        <h2 class="question-prompt">That is every question.</h2>
        <p class="score-line" id="final-score">Score: 0</p>
      </section>
    </div>

    <script type="module" src="/js/play.js"></script>
  </body>
</html>
